<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" fill="none" class="auth-companion-illustration">
  <defs>
    <linearGradient id="companionBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8f8ff"/>
      <stop offset="60%" stop-color="#fced9f"/>
      <stop offset="100%" stop-color="#c3aeff"/>
    </linearGradient>
    <filter id="authShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#1d1f21" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Soft Aura Circle -->
  <circle cx="210" cy="210" r="170" fill="url(#companionBg)" opacity="0.45"/>
  <circle cx="210" cy="210" r="140" stroke="#244cff" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Orbiting Satellites -->
  <!-- Top Left: Shield Badge -->
  <g transform="translate(70, 90)" filter="url(#authShadow)">
    <circle cx="20" cy="20" r="20" fill="#ffffff"/>
    <path d="M 20 10 L 30 14 V 21 C 30 26 25 30 20 31 C 15 30 10 26 10 21 V 14 L 20 10 Z" fill="#00c978"/>
    <path d="M 16 20 L 19 23 L 24 17" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Top Right: Reminder Clock Pill -->
  <g transform="translate(290, 80)" filter="url(#authShadow)">
    <rect x="0" y="0" width="80" height="28" rx="14" fill="#ffffff" stroke="#244cff" stroke-width="1"/>
    <circle cx="14" cy="14" r="8" fill="#e8f8ff"/>
    <polyline points="14,10 14,14 17,16" stroke="#244cff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="30" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#1d1f21">08:00 AM</text>
  </g>

  <!-- Clinical Tablet Display (Tilted in Hands) -->
  <g transform="translate(110, 160)" filter="url(#authShadow)">
    <!-- Tablet Frame -->
    <rect x="0" y="0" width="200" height="150" rx="16" fill="#1d1f21" stroke="#ffffff" stroke-width="3"/>
    <!-- Screen -->
    <rect x="10" y="10" width="180" height="130" rx="10" fill="#ffffff"/>

    <!-- Screen Header -->
    <rect x="25" y="24" width="70" height="8" rx="4" fill="#244cff"/>
    <circle cx="160" cy="28" r="5" fill="#00c978"/>

    <!-- Patient Adherence Waveform Graph -->
    <path d="M 25 70 L 50 70 L 60 55 L 75 85 L 90 60 L 100 70 L 155 70" stroke="#244cff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="90" cy="60" r="4" fill="#244cff"/>

    <!-- Pill Status Strip -->
    <rect x="25" y="95" width="40" height="12" rx="6" fill="#e8f8ff"/>
    <rect x="75" y="95" width="40" height="12" rx="6" fill="#fced9f"/>
    <rect x="125" y="95" width="40" height="12" rx="6" fill="#c3aeff"/>
  </g>

  <!-- Floating Pill Satellite (Bottom Left) -->
  <g transform="translate(75, 290) rotate(35)" filter="url(#authShadow)">
    <rect x="0" y="0" width="42" height="18" rx="9" fill="#244cff"/>
    <path d="M 21 0 L 33 0 A 9 9 0 0 1 42 9 A 9 9 0 0 1 33 18 L 21 18 Z" fill="#ffffff"/>
  </g>

  <!-- Security Chip (Bottom Right) -->
  <g transform="translate(255, 310)" filter="url(#authShadow)">
    <rect x="0" y="0" width="118" height="30" rx="15" fill="#1d1f21"/>
    <circle cx="15" cy="15" r="4" fill="#00c978"/>
    <text x="26" y="19" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#ffffff">Private &amp; Secure</text>
  </g>
</svg>
